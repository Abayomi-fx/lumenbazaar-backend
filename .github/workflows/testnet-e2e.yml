name: Testnet E2E Suite

on:
  # Manual trigger for controlled testnet deployments
  workflow_dispatch:
    inputs:
      mode:
        description: "E2E suite mode"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
      manifest_path:
        description: "Path to testnet endpoints manifest"
        required: false
        default: "docs/deployment/testnet-endpoints.json"
        type: string
  # Automatic smoke tests on main branch push
  push:
    branches:
      - main
    paths:
      - ".github/workflows/testnet-e2e.yml"
      - "scripts/testnet-*.ts"
      - "packages/testkit/**"
      - "packages/buyer-sdk/**"
      - "packages/stellar-payments/**"
  # Allow smoke tests on all PRs
  pull_request:
    paths:
      - ".github/workflows/testnet-e2e.yml"
      - "scripts/testnet-*.ts"
      - "packages/testkit/**"
      - "packages/buyer-sdk/**"
      - "packages/stellar-payments/**"

permissions:
  contents: read

jobs:
  security-check:
    name: Security Validation
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.security.outputs.mode }}
      safe-for-funded: ${{ steps.security.outputs.safe-for-funded }}
      fork-detected: ${{ steps.security.outputs.fork-detected }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate security context
        id: security
        run: |
          # Determine execution mode based on security context
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
            echo "mode=smoke" >> $GITHUB_OUTPUT
            echo "fork-detected=true" >> $GITHUB_OUTPUT
            echo "safe-for-funded=false" >> $GITHUB_OUTPUT
            echo "Fork PR detected - enforcing smoke mode (read-only)"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "fork-detected=false" >> $GITHUB_OUTPUT
            if [[ -n "${{ secrets.CLIENT_PRIVATE_KEY }}" ]]; then
              echo "safe-for-funded=true" >> $GITHUB_OUTPUT
            else
              echo "safe-for-funded=false" >> $GITHUB_OUTPUT
            fi
            echo "Internal PR detected - full e2e eligible (if secrets available)"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "mode=full" >> $GITHUB_OUTPUT
            echo "fork-detected=false" >> $GITHUB_OUTPUT
            if [[ -n "${{ secrets.CLIENT_PRIVATE_KEY }}" ]]; then
              echo "safe-for-funded=true" >> $GITHUB_OUTPUT
            else
              echo "safe-for-funded=false" >> $GITHUB_OUTPUT
            fi
            echo "Main branch push - full e2e eligible (if secrets available)"
          else
            echo "mode=${{ inputs.mode || 'smoke' }}" >> $GITHUB_OUTPUT
            echo "fork-detected=false" >> $GITHUB_OUTPUT
            echo "safe-for-funded=false" >> $GITHUB_OUTPUT
            echo "Manual trigger - using selected mode"
          fi

      - name: Generate security audit log
        run: tsx scripts/ci-security.ts audit-log ${{ steps.security.outputs.mode }}

  smoke-tests:
    name: Smoke Mode (Read-Only)
    runs-on: ubuntu-latest
    needs: security-check
    # Always run smoke tests regardless of mode - provides baseline health check
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke mode (read-only deployment health)
        id: smoke
        run: |
          pnpm deploy:testnet:e2e:smoke \
            --manifest "${{ inputs.manifest_path || 'docs/deployment/testnet-endpoints.json' }}" \
            --output deployment-evidence/smoke-mode.json

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-e2e-smoke-evidence
          path: deployment-evidence/smoke-mode.json
          retention-days: 90

      - name: Report smoke test results
        if: always()
        run: |
          if [[ -f deployment-evidence/smoke-mode.json ]]; then
            echo "## Testnet Smoke Mode Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat deployment-evidence/smoke-mode.json | jq '.summary' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  full-e2e-tests:
    name: Full E2E Suite (With Settlement)
    runs-on: ubuntu-latest
    needs: security-check
    # Only run full e2e if:
    # 1. Security check determined it's safe (not fork PR)
    # 2. We have credentials
    # 3. Mode is 'full'
    if: |
      needs.security-check.outputs.safe-for-funded == 'true' &&
      needs.security-check.outputs.mode == 'full' &&
      secrets.CLIENT_PRIVATE_KEY != ''

    environment:
      name: testnet-e2e
      # Require manual approval for full e2e on PRs
      deployment-branch-policy:
        protected-branches: false
        custom-deployment-branch-policy: ${{ github.ref_name != 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mask sensitive values in logs
        run: |
          # Mask CLIENT_PRIVATE_KEY to prevent accidental exposure
          echo "::add-mask::${{ secrets.CLIENT_PRIVATE_KEY }}"

      - name: Run full e2e suite
        id: e2e
        env:
          CLIENT_PRIVATE_KEY: ${{ secrets.CLIENT_PRIVATE_KEY }}
          TESTNET_MANIFEST_PATH: ${{ inputs.manifest_path || 'docs/deployment/testnet-endpoints.json' }}
          TESTNET_E2E_OUTPUT: deployment-evidence/e2e-full.json
        run: |
          pnpm deploy:testnet:e2e:full \
            --manifest "${{ env.TESTNET_MANIFEST_PATH }}" \
            --output "${{ env.TESTNET_E2E_OUTPUT }}"

      - name: Upload full e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-e2e-full-evidence
          path: deployment-evidence/e2e-full.json
          retention-days: 90

      - name: Upload evidence collection summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-e2e-summary
          path: |
            deployment-evidence/smoke-mode.json
            deployment-evidence/e2e-full.json
          retention-days: 90

      - name: Verify evidence integrity
        if: always()
        run: |
          if [[ -f deployment-evidence/e2e-full.json ]]; then
            echo "## Testnet E2E Evidence Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat deployment-evidence/e2e-full.json | jq '.summary' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            # Check all success criteria
            SUCCESSFUL=$(cat deployment-evidence/e2e-full.json | jq '.summary | all(. == true)' 2>/dev/null || echo "false")
            if [[ "$SUCCESSFUL" == "true" ]]; then
              echo "✅ All e2e verification checks passed"
            else
              echo "❌ Some e2e verification checks failed"
              exit 1
            fi
          fi

  report:
    name: E2E Execution Report
    runs-on: ubuntu-latest
    needs: [security-check, smoke-tests, full-e2e-tests]
    if: always()

    steps:
      - name: Download all evidence artifacts
        uses: actions/download-artifact@v4
        with:
          path: deployment-evidence

      - name: Generate execution report
        run: |
          echo "## Testnet E2E Suite Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Security Context**" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: ${{ needs.security-check.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fork Detected: ${{ needs.security-check.outputs.fork-detected }}" >> $GITHUB_STEP_SUMMARY
          echo "- Safe for Funded Operations: ${{ needs.security-check.outputs.safe-for-funded }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Results**" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Mode: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Full E2E: ${{ needs.full-e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "All evidence files are available in GitHub Actions artifacts for verification." >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const smoke = fs.existsSync('deployment-evidence/testnet-e2e-smoke-evidence/smoke-mode.json') 
              ? JSON.parse(fs.readFileSync('deployment-evidence/testnet-e2e-smoke-evidence/smoke-mode.json', 'utf8'))
              : null;
            
            let comment = '## Testnet E2E Suite Results\n\n';
            comment += `**Security Mode**: ${{ needs.security-check.outputs.mode }}\n`;
            comment += `**Fork PR**: ${{ needs.security-check.outputs.fork-detected }}\n\n`;
            
            if (smoke) {
              comment += '### Smoke Mode (Read-Only)\n';
              comment += `✅ Deployment Health: ${smoke.summary.deploymentHealthy ? 'PASS' : 'FAIL'}\n`;
              comment += `✅ API Reachable: ${smoke.summary.apiReachable ? 'PASS' : 'FAIL'}\n`;
              comment += `✅ MCP Healthy: ${smoke.summary.mcpHealthy ? 'PASS' : 'FAIL'}\n`;
            }
            
            comment += '\n[View full evidence in GitHub Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  summary:
    name: E2E Suite Summary
    runs-on: ubuntu-latest
    needs: [security-check, smoke-tests]
    if: always()

    steps:
      - name: Security Summary
        run: |
          echo "### Testnet E2E Security"
          echo "- Execution Mode: ${{ needs.security-check.outputs.mode }}"
          echo "- Fork Detected: ${{ needs.security-check.outputs.fork-detected }}"
          echo "- Safe for Funded Operations: ${{ needs.security-check.outputs.safe-for-funded }}"
          echo ""
          if [[ "${{ needs.security-check.outputs.mode }}" == "smoke" ]]; then
            echo "**ℹ️ Note**: Running in smoke mode (read-only). No credentials required or used."
          else
            echo "**Full E2E Suite**: Full e2e tests will run if credentials are available and environment is trusted."
          fi

      - name: Smoke Test Summary
        run: |
          echo "### Testnet Smoke Tests"
          if [[ "${{ needs.smoke-tests.result }}" == "success" ]]; then
            echo "✅ Smoke tests completed successfully"
          else
            echo "❌ Smoke tests failed"
          fi

      - name: Full E2E Summary
        if: needs.security-check.outputs.safe-for-funded == 'true'
        run: |
          echo "### Full E2E Suite"
          if [[ "${{ needs.full-e2e-tests.result }}" == "success" ]]; then
            echo "✅ Full e2e suite passed - payment flow verified"
          elif [[ "${{ needs.full-e2e-tests.result }}" == "skipped" ]]; then
            echo "⏭️ Full e2e suite skipped - mode is smoke or unsafe context"
          else
            echo "❌ Full e2e suite failed"
          fi
